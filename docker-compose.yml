version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: flowwatch
      POSTGRES_USER: flowwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowwatch -d flowwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://flowwatch:${POSTGRES_PASSWORD}@db:5432/flowwatch
      ENVIRONMENT: development
      DEBUG: 'true'
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  n8n:
    image: n8nio/n8n
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin
    ports: ["5678:5678"]
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  n8n_data: